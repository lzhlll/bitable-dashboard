<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitable Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 16px; margin: 0; }
    .btn-group { margin-bottom: 16px; display: flex; gap: 12px; }
    .btn {
      padding: 8px 24px;
      border: 1px solid #3370ff;
      border-radius: 6px;
      background: #fff;
      color: #3370ff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover { background: #f0f4ff; }
    .btn.active {
      background: #3370ff;
      color: #fff;
    }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th { background: #f5f6f7; font-weight: 600; position: sticky; top: 0; }
    tr:hover td { background: #f7f9ff; }
    .progress-bar {
      display: inline-block;
      width: 60px;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      vertical-align: middle;
    }
    .progress-fill {
      height: 100%;
      background: #3370ff;
      border-radius: 4px;
    }
    .date-text { color: #666; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      background: #e8f0ff;
      color: #3370ff;
      font-size: 12px;
      margin: 2px;
    }
  </style>
</head>
<body>
  <div class="btn-group">
    <button class="btn active" id="btnA" onclick="switchView('A')">基本信息</button>
    <button class="btn" id="btnB" onclick="switchView('B')">详细信息</button>
  </div>
  <div class="table-container">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.31.js"></script>
  <script>
    const fieldGroups = {
      A: ['No.', 'Topic', 'Subject', 'Operation', 'Department', 'Status', 'Remarks', 'Page Link'],
      B: ['No.', 'Page Link', 'Task Owner', 'Department', 'Topic', 'Attachment', 'Activity Overview',
          'Due date', 'Progress', 'Subject Topic', 'Activity Overview(', 'Operation',
          'Updated date', 'Year', 'CW']
    };

    let allFields = [];
    let allRecords = [];
    let currentGroup = 'A';

    async function init() {
      const table = await bitable.base.getActiveTable();
      allFields = await table.getFieldMetaList();

      const recordList = await table.getRecordList();
      allRecords = recordList.map(r => r.fields);

      renderTable();
    }

    function switchView(group) {
      currentGroup = group;
      document.getElementById('btnA').classList.toggle('active', group === 'A');
      document.getElementById('btnB').classList.toggle('active', group === 'B');
      renderTable();
    }

    function formatCellValue(fieldName, value) {
      if (value === null || value === undefined) return '<span style="color:#bbb">\u2014</span>';

      if (fieldName === 'Due date' || fieldName === 'Updated date') {
        if (typeof value === 'number') {
          const date = new Date(value);
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          const h = String(date.getHours()).padStart(2, '0');
          const min = String(date.getMinutes()).padStart(2, '0');
          return '<span class="date-text">' + y + '-' + m + '-' + d + ' ' + h + ':' + min + '</span>';
        }
        return value;
      }

      if (fieldName === 'Progress') {
        const pct = Math.round((value || 0) * 100);
        return '<span class="progress-bar"><span class="progress-fill" style="width:' + pct + '%"></span></span> ' + pct + '%';
      }

      if (Array.isArray(value)) {
        const texts = value.map(item => {
          if (typeof item === 'string') return item;
          if (item.text) return item.text;
          if (item.name) return item.name;
          return JSON.stringify(item);
        });
        return texts.map(t => '<span class="tag">' + t + '</span>').join(' ');
      }

      if (fieldName === 'Year' && typeof value === 'number') {
        return String(value);
      }

      if (typeof value === 'string') return value;
      if (typeof value === 'object') {
        if (value.text) return value.text;
        if (value.name) return value.name;
        return JSON.stringify(value);
      }
      return String(value);
    }

    function renderTable() {
      const fieldNames = fieldGroups[currentGroup];
      const orderedFields = fieldNames.map(name =>
        allFields.find(f => f.name === name)
      ).filter(f => f);

      const head = orderedFields.map(f => '<th>' + f.name + '</th>').join('');
      document.getElementById('tableHead').innerHTML = '<tr>' + head + '</tr>';

      const body = allRecords.map(record => {
        const cells = orderedFields.map(f => {
          const val = record[f.name] !== undefined ? record[f.name] : record[f.id];
          return '<td>' + formatCellValue(f.name, val) + '</td>';
        }).join('');
        return '<tr>' + cells + '</tr>';
      }).join('');
      document.getElementById('tableBody').innerHTML = body;
    }

    init();
  </script>
</body>
</html>
